<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FarmLinked | Login and Register</title>
    <link rel="icon" href="../assets/images/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/signin.css?v=2">
</head>
<body>

    <div class="container">

        <!-- LEFT: welcome side -->
        <div class="brand">
            <a href="../Landing/landing.html" class="brand-logo" aria-label="FarmLinked home">
                <img src="../assets/images/logo.png" alt="" class="logo-img">
                <span>FarmLinked</span>
            </a>
            <a href="../Landing/landing.html" class="back-link">&larr; Back to homepage</a>

            <h1>Welcome to the Farm-to-Market Linkage</h1>
            <p>Login to continue, or create a new account</p>
        </div>

        <!-- RIGHT: form card -->
        <div class="card">
            <div class="tabs">
                <button type="button" class="tab-btn active" data-target="login-form">Login</button>
                <button type="button" class="tab-btn " data-target="register-form">Register</button>
            </div>

            <div class="form-panel">

                <!-- Login Form -->
                <div class="form-box active" id="login-form">
                    <h2>Sign In</h2>
                    <p class="form-sub">Enter your credentials to continue</p>

                    <form id="loginForm" action="#">
                        <div class="field">
                            <label for="login-email">Email</label>
                            <input type="email" id="login-email" name="email" placeholder="you@example.com" required>
                        </div>

                        <div class="field">
                            <label for="login-password">Password</label>
                            <input type="password" id="login-password" name="password" placeholder="••••••••" required>
                        </div>

                        <button type="submit" name="login" class="btn-primary">Log In</button>

                        <p class="switch-line">
                            Don't have an account?
                            <a href="#" class="switch-link" data-target="register-form">Register</a>
                        </p>
                    </form>
                </div>

                <!-- Register Form -->
                <div class="form-box " id="register-form">
                    <h2>Create Account</h2>
                    <p class="form-sub">Fill in your details to get started</p>

                    <form id="registerForm" action="#">
                        <div class="field">
                            <label for="reg-name">Name</label>
                            <input type="text" id="reg-name" name="name" placeholder="Jane Doe" required>
                        </div>

                        <div class="field">
                            <label for="reg-email">Email</label>
                            <input type="email" id="reg-email" name="email" placeholder="you@example.com" required>
                        </div>

                        <div class="field">
                            <label for="reg-password">Password</label>
                            <input type="password" id="reg-password" name="password" placeholder="At least 8 characters" required minlength="8">
                        </div>

                        <div class="field">
                            <label for="reg-role">Role</label>
                            <select id="reg-role" name="role" required>
                                <option value="">Select Role</option>
                                <option value="admin">Admin</option>
                                <option value="user">User</option>
                            </select>
                        </div>

                        <button type="submit" name="register" class="btn-primary">Create Account</button>

                        <p class="switch-line">
                            Already have an account?
                            <a href="#" class="switch-link" data-target="login-form">Login</a>
                        </p>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <script src="../assets/js/signin.js"></script>
    <script>
    // Preview-only: login goes to the admin dashboard, register goes back to login
    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        window.location.href = 'dashboard.html';
    });
    document.getElementById('registerForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var tab = document.querySelector('.tab-btn[data-target="login-form"]');
        if (tab) tab.click();
    });
    </script>
</body>
</html>
